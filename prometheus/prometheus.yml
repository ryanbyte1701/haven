# Prometheus config for Haven. Scrapes Haven's /metrics endpoint every 30 seconds.
# Used by the optional `prometheus` service in docker-compose.yml.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: haven
    metrics_path: /metrics
    static_configs:
      - targets: ["haven:1701"]     # the haven service name and its internal port
    # /metrics needs a token: set the "/metrics bearer token" in Haven > Settings > History & metrics,
    # then uncomment and paste it here:
    # authorization:
    #   type: Bearer
    #   credentials: "your-metrics-token"
