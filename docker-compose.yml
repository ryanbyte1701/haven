# Haven. Works with `docker compose up -d` and with Synology Container Manager
# (Project > Create > "Create docker-compose.yml" and paste this file). See SYNOLOGY.md.

services:
  haven:
    # Prebuilt image from GitHub (Intel + ARM64). Container Manager pulls it, no build needed.
    image: ghcr.io/ryanbyte1701/haven:latest
    # To build from this folder instead (e.g. after editing the code), comment the line
    # above and uncomment the next one:
    # build: .
    container_name: haven
    restart: unless-stopped
    # UID:GID that owns ./data on the host.
    #   Synology: the first admin account is usually 1026:100. Check with `id <username>` over SSH.
    #   Other Linux: run `id` and use your uid:gid (often 1000:1000).
    user: "1026:100"
    # Hardening: nothing in the image needs extra privileges or to write outside /data and /tmp
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      # LEFT number = port on your NAS/host; change it if already taken (e.g. "1801:1701").
      # HTTP: dashboard, Ecowitt gateways (they can't use HTTPS) and /metrics.
      - "1701:1701"
      # HTTPS: https://NAS-IP:1702. Self-signed certificate by default (accept it once in the
      # browser), or use your own with HAVEN_TLS_CERT/HAVEN_TLS_KEY below.
      - "1702:1702"
    environment:
      TZ: America/Phoenix
      # ┌──────────────────────────────────────────────────────────────────────────────┐
      # │ FIRST SIGN-IN: admin / haven-admin. Haven asks you to choose your own password │
      # │ (and optionally a new username) right away. To start with your own instead,   │
      # │ uncomment and set these BEFORE the first start (only used while no account     │
      # │ exists yet). Anyone on your network who knows the default can sign in until    │
      # │ you've changed it, so do that right after installing.                          │
      # └──────────────────────────────────────────────────────────────────────────────┘
      # HAVEN_ADMIN_USER: "admin"
      # HAVEN_ADMIN_PASSWORD: "use-a-long-unique-password"
      # Names you open Haven by, besides IP addresses and LAN names (diskstation, *.local, *.lan, *.home.arpa).
      # Needed for your own domain / reverse proxy, e.g. "haven.example.com". Other names get "421" (this
      # stops malicious websites from reaching Haven through your browser).
      # HAVEN_ALLOWED_HOSTS: "haven.example.com"
      # Only needed behind a reverse proxy that isn't on 127.0.0.1 inside the container
      # (e.g. Synology's reverse proxy reaches Haven from the Docker network): set to the
      # proxy's address so Haven trusts its X-Forwarded-For/-Proto headers (client address for the
      # sign-in limiter, https). X-Forwarded-Host is never used: list proxy names in HAVEN_ALLOWED_HOSTS. Never use "*".
      # FORWARDED_ALLOW_IPS: "172.17.0.1"
      # ── HTTPS ──
      # Send browsers from http://…:1701 to https://…:1702 (Ecowitt, /metrics and health stay on HTTP):
      # HAVEN_HTTPS_ONLY: "1"
      # Extra names/IPs for the self-signed certificate (delete data/tls to regenerate):
      # HAVEN_TLS_HOSTS: "haven.home,192.168.1.20"
      # Your own certificate instead (e.g. copied from DSM > Security > Certificate > Export);
      # put the files in ./config/tls/:
      # HAVEN_TLS_CERT: /config/tls/fullchain.pem
      # HAVEN_TLS_KEY: /config/tls/privkey.pem
      # HTTPS off: HAVEN_HTTPS_PORT: "0"
    # Optional: keep extra secrets for ${VARS} in config.yaml in a file (see haven.env.example):
    # env_file: haven.env
    volumes:
      - ./config:/config:ro
      - ./data:/data
    depends_on:
      - mosquitto

  # Local MQTT broker. Delete this service (and `depends_on` above) if you already run one,
  # e.g. with Zigbee2MQTT, and point mqtt.host in config.yaml at it.
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    # Not published by default: Haven reaches it over the internal Docker network. The broker
    # has no password, so publishing it lets anyone on your LAN send commands to your devices.
    # Uncomment only if devices elsewhere on your network (Zigbee2MQTT, Shelly, ESPHome) must
    # connect, and preferably add a password first (see below).
    # ports:
    #   - "1883:1883"
    # Uses the config built into the image (port 1883, no login, LAN use). To require a
    # password, mount your own file instead: see mosquitto/mosquitto.conf in the repo.
    command: mosquitto -c /mosquitto-no-auth.conf
    volumes:
      - mosquitto-data:/mosquitto/data

  # Optional long-term metrics store. Only starts with:  docker compose --profile metrics up -d
  # Synology Container Manager doesn't ask about profiles: delete the two `profiles:` lines
  # below to include it. Then in Haven: Settings > History & metrics > Store history in: prometheus.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    profiles:
      - metrics
    # The named volume below works as-is. If you swap it for a folder (./prometheus-data:/prometheus),
    # uncomment this so the container can write there (Synology: usually 1026:100).
    # user: "1026:100"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-1y}
    ports:
      # Prometheus has no login: it's reachable from this NAS only. Change to "9090:9090" only if
      # Grafana on another machine needs it, and be aware anyone on your LAN can then read your history.
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # Optional Matter controller (Settings > Matter). Uncomment to use Matter devices; see
  # docs/integrations/matter.md (or deploy/synology/docker-compose.matter.yml for a separate project).
  # Needs host networking and IPv6 on your LAN. It has no password: never publish port 5580 to the internet.
  # Haven finds it on this machine by itself (leave the address in Settings > Matter empty).
  # matter-server:
  #   image: ghcr.io/matter-js/matterjs-server:stable
  #   container_name: matter-server
  #   restart: unless-stopped
  #   network_mode: host
  #   user: "1026:100"          # owner of ./matter (other Linux: often 1000:1000, the image's default)
  #   read_only: true
  #   tmpfs:
  #     - /tmp
  #   cap_drop: [ALL]
  #   security_opt:
  #     - no-new-privileges:true
  #   volumes:
  #     - ./matter:/data        # Matter fabric credentials and device data: back it up

volumes:
  mosquitto-data:
  prometheus-data:
