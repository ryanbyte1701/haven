# Builds and publishes the Haven image to GitHub Container Registry on every push to main
# (and for version tags like v1.2.0). Multi-arch so it runs on Intel/AMD and ARM64 Synology NAS.
name: Build & publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check dashboard JavaScript syntax
        run: |
          set -e
          for f in app/static/*.js; do node --check "$f"; done
      - name: Run tests
        run: |
          set -o pipefail
          HAVEN_DATA=/tmp/haven-test pytest -q -rfE --tb=short tests 2>&1 | tee pytest.log || {
            # surface failures as annotations (visible on the run page without opening logs)
            grep -E "^(FAILED|ERROR) |^E  |Error:|Exception" pytest.log | head -25 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1; }

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build the amd64 image locally first and make sure it imports, so a broken image
      # (missing dependency, syntax error) is never pushed as :latest.
      - name: Smoke test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: haven:smoke
          cache-from: type=gha
      - run: docker run --rm --entrypoint python haven:smoke -c "import app.main"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
