<!doctype html>
<html lang="en" data-seed="ocean" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>Haven</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'">
<script src="/static/theme-init.js"></script>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/automations.css">
<script src="/static/icons.js"></script>
</head>
<body>
<nav class="rail" id="nav">
  <div class="rail-logo" data-icon="home" data-fill></div>
  <div class="destinations">
    <button data-f="all" data-phone><span class="ind" data-icon="dashboard"></span><span class="lbl">Home</span></button>
    <button data-f="climate" data-phone><span class="ind" data-icon="thermostat"></span><span class="lbl">Climate</span></button>
    <button data-f="air"><span class="ind" data-icon="air"><b class="badge warn" id="badge-air"></b></span><span class="lbl">Air quality</span></button>
    <button data-f="lights" data-phone><span class="ind" data-icon="lightbulb"><b class="badge info" id="badge-lights"></b></span><span class="lbl">Lights</span></button>
    <button data-f="water"><span class="ind" data-icon="water_drop"></span><span class="lbl">Water</span></button>
    <button data-f="doors" data-phone><span class="ind" data-icon="sensor_door"><b class="badge warn" id="badge-doors"></b></span><span class="lbl">Doors</span></button>
    <button data-f="security"><span class="ind" data-icon="shield_lock"></span><span class="lbl">Security</span></button>
    <button data-f="controls"><span class="ind" data-icon="tune"></span><span class="lbl">Controls</span></button>
    <button data-f="battery"><span class="ind" data-icon="battery_full"><b class="badge" id="badge-battery"></b></span><span class="lbl">Battery</span></button>
    <button data-f="power"><span class="ind" data-icon="power"><b class="badge" id="badge-power"></b></span><span class="lbl">Power</span></button>
    <button data-f="devices"><span class="ind" data-icon="devices"></span><span class="lbl">Devices</span></button>
    <div id="custom-views" class="custom-views"></div>
    <button class="add-view" data-new-view title="Create a custom view"><span class="ind" data-icon="add"></span><span class="lbl">New view</span></button>
    <button class="more-btn" data-open="more"><span class="ind" data-icon="more_horiz"><b class="badge" id="badge-more"></b></span><span class="lbl">More</span></button>
  </div>
  <button class="rail-settings" data-f="settings" aria-label="Settings"><span class="ind" data-icon="settings"></span><span class="lbl">Settings</span></button>
</nav>

<div class="page">
  <header class="appbar">
    <div>
      <div class="greeting" id="greeting">Haven</div>
      <div class="subtitle" id="subtitle"></div>
    </div>
    <div class="actions">
      <span class="live" id="conn" title="Live connection" role="status" aria-label="Connecting"></span>
      <button class="icon-btn" id="editview" aria-label="Edit this view" title="Edit this view" data-icon="tune" hidden></button>
      <button class="icon-btn" id="viewmode" aria-label="Switch to table view" title="Table view" data-icon="table_rows"></button>
      <button class="icon-btn" id="editmode" aria-label="Edit devices" title="Rename, move or hide devices" data-icon="edit"></button>
    </div>
  </header>

  <section class="summary" id="summary"></section>
  <section class="banners" id="alerts"></section>
  <main id="rooms"></main>
  <footer id="status" hidden></footer>
</div>

<div class="snackbar" id="snackbar" role="status" aria-live="polite"></div>

<dialog id="more" class="sheet">
  <form method="dialog">
    <div class="handle"></div>
    <div class="sheet-items">
      <button value="air" data-f="air"><span data-icon="air"></span>Air quality</button>
      <button value="battery" data-f="battery"><span data-icon="battery_full"></span>Batteries</button>
      <button value="water" data-f="water"><span data-icon="water_drop"></span>Water</button>
      <button value="security" data-f="security"><span data-icon="shield_lock"></span>Security</button>
      <button value="controls" data-f="controls"><span data-icon="tune"></span>Controls</button>
      <button value="power" data-f="power"><span data-icon="power"></span>Power</button>
      <button value="devices" data-f="devices"><span data-icon="devices"></span>Devices</button>
      <div id="more-views"></div>
      <button type="button" data-new-view><span data-icon="add"></span>New view</button>
      <button value="settings" data-f="settings"><span data-icon="settings"></span>Settings</button>
    </div>
  </form>
</dialog>

<dialog id="edit" class="m3-dialog">
  <form method="dialog">
    <div class="dlg-icon" data-icon="edit"></div>
    <h2>Edit device</h2>
    <label class="textfield"><input name="name" placeholder=" " required><span>Name</span></label>
    <label class="textfield"><input name="room" placeholder=" " list="roomlist"><span>Room</span></label>
    <datalist id="roomlist"></datalist>
    <label class="check"><input type="checkbox" name="pinned"><span>Pin to Favorites on Home</span></label>
    <label class="check"><input type="checkbox" name="hidden"><span>Hide from dashboard</span></label>
    <div class="dlg-actions"><button class="text-btn" value="cancel" formnovalidate>Cancel</button><button class="text-btn" value="save">Save</button></div>
  </form>
</dialog>

<dialog id="confirm" class="m3-dialog">
  <form method="dialog">
    <div class="dlg-icon" id="confirm-icon"></div>
    <h2 id="confirm-title"></h2>
    <p id="confirm-text"></p>
    <div class="dlg-actions"><button class="text-btn" value="no">Cancel</button><button class="text-btn" value="yes" id="confirm-yes">Confirm</button></div>
  </form>
</dialog>

<dialog id="snapshot" class="m3-dialog wide">
  <form method="dialog">
    <h2 id="snap-title">Snapshot</h2>
    <div class="snap-frame" id="snap-frame"></div>
    <div class="dlg-actions"><button type="button" class="text-btn" id="snap-refresh">Refresh</button><button class="text-btn" value="close">Close</button></div>
  </form>
</dialog>

<dialog id="devpanel" class="m3-dialog wide devpanel">
  <form method="dialog">
    <div id="devpanel-body"></div>
    <div class="dlg-actions"><button class="text-btn" value="close">Close</button></div>
  </form>
</dialog>

<dialog id="history" class="m3-dialog wide">
  <form method="dialog">
    <h2 id="hist-title">History</h2>
    <div class="segmented ranges" id="hist-ranges"></div>
    <div class="hist-chart" id="hist-chart"></div>
    <div class="hist-stats" id="hist-stats"></div>
    <div class="dlg-actions"><button class="text-btn" value="close">Close</button></div>
  </form>
</dialog>

<dialog id="viewdlg" class="m3-dialog wide">
  <form method="dialog" id="view-form">
    <h2 id="view-title">New view</h2>
    <label class="textfield"><input name="name" placeholder=" " required maxlength="40"><span>Name</span></label>
    <div class="field-label">Icon</div><div class="icon-pick" id="icon-pick"></div>
    <p class="vhelp">Show devices that match <b>all</b> the filters you pick (leave a group empty to ignore it), plus any you pick by hand.</p>
    <div class="field-label">Rooms</div><div class="chipset" id="pick-rooms"></div>
    <div class="field-label">Types</div><div class="chipset" id="pick-types"></div>
    <div class="field-label">Brands</div><div class="chipset" id="pick-sources"></div>
    <div class="field-label">Pick devices by hand</div><div class="devpick" id="pick-devices"></div>
    <div class="vcount" id="view-count"></div>
    <div class="dlg-actions"><button type="button" class="text-btn danger" id="view-delete">Delete view</button><span style="flex:1"></span>
      <button class="text-btn" value="cancel" formnovalidate>Cancel</button><button class="text-btn" value="save">Save</button></div>
  </form>
</dialog>

<dialog id="login" class="m3-dialog">
  <form method="dialog" id="login-form">
    <div class="dlg-icon" data-icon="login"></div>
    <h2 id="login-title">Sign in</h2>
    <p id="login-help"></p>
    <div id="login-fields"></div>
    <div class="dlg-actions"><button class="text-btn" value="cancel" formnovalidate>Cancel</button><button class="text-btn" id="login-go" value="go">Continue</button></div>
  </form>
</dialog>
<script src="/static/sortable.min.js"></script>
<script src="/static/app.js"></script>
<script src="/static/automations.js"></script>
</body>
</html>
