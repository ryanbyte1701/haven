# Haven with HIGH AVAILABILITY (beta): use this file on BOTH NASes instead of docker-compose.yml.
# Full guide: SYNOLOGY.md, section "High availability (beta)".
#
# What's different from the normal file, and why:
#  - network_mode: host   Haven must add the shared virtual IP to the NAS's own network card, so it can't sit
#                         behind Docker's NAT. There is no ports: section; Haven listens directly on the NAS's
#                         ports 1701 (HTTP) and 1702 (HTTPS). Change them with HAVEN_PORT / HAVEN_HTTPS_PORT.
#  - NET_ADMIN, NET_RAW   to add/remove the virtual IP (`ip addr`) and announce it (gratuitous ARP).
#  - user: "0:0"          like the normal file, the container starts as root for a few milliseconds: it fixes the
#                         ownership of config/ and data/, switches to your NAS user keeping just NET_ADMIN +
#                         NET_RAW (Docker only gives cap_add capabilities to root) and drops the rest for good.
#  - MQTT                 the broker below is published on 127.0.0.1:1883 only. In Haven: Settings → MQTT →
#                         Broker host 127.0.0.1 (not "mosquitto": host networking can't use Docker's names).
#
# Steps (on each NAS): create docker/haven, docker/haven/config and docker/haven/data in File Station, then
# Container Manager > Project > Create > paste this file, change the lines marked <-- CHANGE, Done.
# Then in Haven: Settings > High availability (beta). Primary first, then the standby with the same secret.

services:
  haven:
    image: ghcr.io/ryanbyte1701/haven:latest
    container_name: haven
    restart: unless-stopped
    network_mode: host

    user: "0:0"                                         # only for app.privdrop's first milliseconds, see above
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]   # only NET_* are kept
    security_opt:
      - no-new-privileges:true

    environment:
      # Your NAS user (optional: normally detected from the data folder's owner). Check with: id <dsm-user>
      # HAVEN_UID: "1026"
      # HAVEN_GID: "100"
      TZ: America/Phoenix                               # <-- CHANGE to your time zone if needed
      # First sign-in: admin / haven-admin, then Haven makes you choose your own password. To start with your
      # own instead, set these before the first start (only used while no account exists). CHANGE the default
      # right after installing: anyone on your network who knows it can sign in until you do.
      # HAVEN_ADMIN_USER: "admin"
      # HAVEN_ADMIN_PASSWORD: "use-a-long-unique-password"
      # A backup paired automatically from the primary ("Make it my standby") only needs its admin login once:
      # the primary's accounts replace it a few seconds later. Pair right after starting the backup, or set
      # HAVEN_ADMIN_PASSWORD here and type it in the pairing form: until it is paired or claimed, anyone on your
      # network who knows the default could take over this Haven (and, with NET_ADMIN, the virtual IP).
      # With host networking Haven sees the real client addresses; nothing to trust here by default.
      FORWARDED_ALLOW_IPS: "127.0.0.1"
      # Put the NAS's own IP and the virtual IP in the self-signed certificate (delete data/tls after changing):
      # HAVEN_TLS_HOSTS: "192.168.1.20,192.168.1.50"
      # Ports on the NAS (host networking: these ARE the NAS's ports). Use the same on both NASes.
      # HAVEN_PORT: "1701"
      # HAVEN_HTTPS_PORT: "1702"
      # Testing only, never in production: pretend to add/remove the virtual IP.
      # HAVEN_HA_DRY_RUN: "1"

    volumes:
      - ./config:/config        # your configuration: settings, accounts, layout, automations (+ optional config.yaml)
      - ./data:/data            # history (history.db), sign-in sessions and tokens, certificates

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    depends_on:
      - mosquitto

  # Each NAS runs its own broker; only the active Haven connects to devices. Devices that publish to MQTT
  # (Zigbee2MQTT, Shelly, ESPHome) should use the VIRTUAL IP as their broker address so they follow the
  # active Haven: then change the port line to "1883:1883" and give the broker a password (mosquitto/mosquitto.conf).
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    command: mosquitto -c /mosquitto-no-auth.conf
    ports:
      - "127.0.0.1:1883:1883"   # Haven reaches it at 127.0.0.1:1883 (Settings → MQTT → Broker host 127.0.0.1)
    volumes:
      - mosquitto-data:/mosquitto/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  mosquitto-data:
